<div class="shell">
  <header>
    <a class="brand" routerLink="/sales">
      <span aria-hidden="true">S</span>
      Sales Portal
    </a>
    <nav aria-label="Main navigation">
      <a routerLink="/sales" routerLinkActive="active">Sales</a>
    </nav>
    @if (session(); as user) {
      <app-user-menu [name]="user.name" [role]="user.role" (signOut)="logout()" />
    }
  </header>
  <main>
    <router-outlet />
  </main>
  <app-toast-viewport />
</div>
