services:
  database:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: developer_evaluation_e2e
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD:
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U e2e -d developer_evaluation_e2e']
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  webapi:
    image: ambev-developer-evaluation-e2e-webapi:local
    build:
      context: .
      dockerfile: src/backend/Ambev.DeveloperEvaluation.WebApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection:
      Jwt__SecretKey:
      DevelopmentAdmin__Enabled: 'true'
      DevelopmentAdmin__Email:
      DevelopmentAdmin__Password:
      Security__LoginRateLimit__PermitLimit: 20
    ports:
      - '127.0.0.1:5120:8080'
    depends_on:
      database:
        condition: service_healthy
