name: ambev-developer-evaluation

services:
  database:
    image: postgres:16.15-alpine
    environment:
      - POSTGRES_DB=developer_evaluation
      - POSTGRES_USER=developer
      # Pass through the value from the host environment or the local .env file.
      - POSTGRES_PASSWORD
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U developer -d developer_evaluation"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrations:
    image: ambev-developer-evaluation-migrations:local
    build:
      context: .
      dockerfile: src/backend/Ambev.DeveloperEvaluation.WebApi/Dockerfile
      target: migrations
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION_STRING:?Set DATABASE_CONNECTION_STRING in .env}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  webapi:
    image: ambev-developer-evaluation-webapi:local
    build:
      context: .
      dockerfile: src/backend/Ambev.DeveloperEvaluation.WebApi/Dockerfile
      target: final
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION_STRING:?Set DATABASE_CONNECTION_STRING in .env}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      DevelopmentAdmin__Enabled: ${DEVELOPMENT_ADMIN_ENABLED:-false}
      DevelopmentAdmin__Email: ${DEVELOPMENT_ADMIN_EMAIL:-}
      DevelopmentAdmin__Password: ${DEVELOPMENT_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${API_PORT:-5119}:8080"
    depends_on:
      database:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:8080/health/ready",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: ambev-developer-evaluation-frontend:local
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:8080"
    depends_on:
      webapi:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
